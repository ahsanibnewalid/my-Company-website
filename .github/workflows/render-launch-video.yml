name: Render Axiom Labs Launch Video

on:
  push:
    branches:
      - feat/axiom-labs-launch-video
    paths:
      - "promo-video/**"
      - ".github/workflows/render-launch-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: promo-video
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: promo-video/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Render MP4
        run: npx remotion render src/index.tsx AxiomLabsLaunch out/axiom-labs-launch.mp4 --codec=h264 --crf=18 --gl=swiftshader
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: axiom-labs-launch-video
          path: promo-video/out/axiom-labs-launch.mp4
          if-no-files-found: error
          retention-days: 14
