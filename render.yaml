services:
  - type: web
    name: axiom-labs
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DJANGO_API_URL
        sync: false
      - key: WEBSITE_SUBMISSION_KEY
        sync: false
